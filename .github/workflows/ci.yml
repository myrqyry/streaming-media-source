name: Build and test

on:
  pull_request:
  push:
    branches: [main, master, ci/native-platforms, feature/twitch-media, feature/streaming-audio, feature/tiktok-video, ci/shared-plugin-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@197937941f13cd2adabd302a19691b44b62b2032
    with:
      module: obs-streaming-media
      package-name: streaming-media-source
      minimum-tests: 10
