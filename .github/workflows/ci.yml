name: Build and test

on:
  pull_request:
  push:
    branches: [main, master, ci/native-platforms, feature/twitch-media, feature/streaming-audio, feature/tiktok-video]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 · OBS ${{ matrix.obs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: "32.2.0"
            runner: ubuntu-24.04
          - obs: "33.0.3"
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check README links
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-verify-native.py
          python3 .github/scripts/test-readme-links.py
          python3 .github/scripts/check_readme_links.py README.md
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            xvfb xauth libgl1-mesa-dri qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            extra-cmake-modules libsimde-dev uthash-dev uuid-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libasound2-dev libjansson-dev libdrm-dev libegl-dev \
            libgl-dev libopengl-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinput-dev libglib2.0-dev zlib1g-dev
      - name: Prepare pinned OBS SDK
        run: bash .github/scripts/prepare-obs32-sdk.sh "$RUNNER_TEMP/obs-sdk" "${{ matrix.obs }}"
      - name: Build, test and verify the local install archive
        run: bash .github/scripts/verify-linux.sh "$RUNNER_TEMP/obs-sdk/sdk" "$RUNNER_TEMP/plugin-ci" obs-streaming-media 9
      - name: Record checksums in job summary
        run: |
          echo '### Verified local test archive (not uploaded)' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/plugin-ci/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

  native:
    name: ${{ matrix.platform.label }} · OBS ${{ matrix.obs }}
    strategy:
      fail-fast: false
      matrix:
        obs: ["32.2.0", "33.0.3"]
        platform:
          - label: Windows x64
            runner: windows-2025-vs2026
          - label: macOS Apple Silicon
            runner: macos-26
          - label: macOS Intel
            runner: macos-26-intel
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native SDK, build, test and package
        shell: bash

        run: python .github/scripts/verify-native.py "$RUNNER_TEMP/native-ci" --obs-version "${{ matrix.obs }}"
