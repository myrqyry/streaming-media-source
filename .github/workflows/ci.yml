name: Build and test

on:
  pull_request:
  push:
    branches: [main, master, ci/native-platforms, feature/twitch-media, feature/streaming-audio, feature/tiktok-video, ci/shared-plugin-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/plugin-build.yml
    with:
      module: obs-streaming-media
      minimum-tests: 9
