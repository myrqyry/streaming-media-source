name: Build and test

on:
  pull_request:
  push:
    branches: [main, master, ci/native-platforms, feature/twitch-media, feature/streaming-audio, feature/tiktok-video, ci/shared-plugin-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@db6c0a2495456274ecf91f18fc83dd64dc6d29e8
    with:
      module: obs-streaming-media
      minimum-tests: 9
